name: phoenix
description: "Phoenix — the go-to app for NCC cadets and their units."
publish_to: 'none'
version: 0.10.0+14

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  image: ^4.13.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
