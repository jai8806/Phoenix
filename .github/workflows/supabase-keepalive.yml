# Free Supabase projects pause after a week without activity (e.g. over
# vacations). This reads one row every three days so the project stays awake.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 4 */3 * *"   # 09:47 IST every third day
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database through the API
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" -a -n "$SUPABASE_PUBLISHABLE_KEY" || {
            echo "::error::Add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY under Settings > Secrets and variables > Actions > Variables"; exit 1; }
          # Row-level security returns no rows to an anonymous caller, but the query still runs.
          curl -fsS --retry 3 --retry-delay 20 \
            "$SUPABASE_URL/rest/v1/units?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -o /dev/null -w "HTTP %{http_code}\n"
