# Weekly backup of the Phoenix database to Google Cloud Storage.
# Free Supabase projects have no automatic backups; this is the safety net.
# Setup and restore steps: docs/OPERATIONS.md.
name: Supabase backup

on:
  schedule:
    - cron: "43 20 * * 6"    # Sunday 02:13 IST
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump the database
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "::error::Add the SUPABASE_DB_URL secret (see docs/OPERATIONS.md)"; exit 1; }
          file="$(tools/ops/backup_db.sh backups)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          ls -la backups

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload to Cloud Storage
        env:
          GCS_BUCKET: ${{ vars.GCS_BACKUP_BUCKET }}
        run: |
          test -n "$GCS_BUCKET" || { echo "::error::Add the GCS_BACKUP_BUCKET variable (see docs/OPERATIONS.md)"; exit 1; }
          gcloud storage cp "${{ steps.dump.outputs.file }}" "gs://$GCS_BUCKET/phoenix/"
          gcloud storage ls -l "gs://$GCS_BUCKET/phoenix/" | tail -5
